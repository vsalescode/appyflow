services:
  app:
    build:
      context: .
    environment:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://appyflow:appyflow@database:5432/appyflow
      ARTIFACTS_DIR: /app/data/artifacts
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-disabled}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - artifacts-data:/app/data

  worker:
    build:
      context: .
      target: worker
    profiles: ["worker"]
    environment:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://appyflow:appyflow@database:5432/appyflow
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-disabled}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://appyflow:appyflow@database:5432/appyflow
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appyflow
      POSTGRES_USER: appyflow
      POSTGRES_PASSWORD: appyflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appyflow -d appyflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
  artifacts-data:
